<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="990" viewBox="0 0 1100 990" role="img" aria-labelledby="title desc"><title id="title">MES 시스템 통신 구성</title><desc id="desc">HMI에서 서버와 Gateway를 거쳐 PLC로 제어 명령을 전달하고, Gemini의 생산 데이터를 MQTT로 수집해 서버와 DB에 저장합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60a5fa"/></marker></defs><rect width="1100" height="990" rx="16" fill="#0f172a"/><g font-family="Arial, 'Noto Sans CJK KR', sans-serif"><path d="M515 120V200" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/><text x="515" y="153" text-anchor="middle" fill="#cbd5e1" font-size="17">HTTP · 현황 조회</text><text x="515" y="178" text-anchor="middle" fill="#cbd5e1" font-size="17">제어 요청</text><path d="M450 290V400" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/><text x="440" y="335" text-anchor="middle" fill="#cbd5e1" font-size="17">SignalR</text><text x="440" y="360" text-anchor="middle" fill="#cbd5e1" font-size="17">제어 명령</text><path d="M600 400V290" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/><text x="650" y="335" text-anchor="middle" fill="#cbd5e1" font-size="17">HTTP</text><text x="650" y="360" text-anchor="middle" fill="#cbd5e1" font-size="17">수집 데이터</text><path d="M680 245H730" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/><text x="870" y="167" text-anchor="middle" fill="#cbd5e1" font-size="17">생산 데이터 저장·조회</text><path d="M400 490V550H205V610" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/><text x="270" y="532" text-anchor="middle" fill="#cbd5e1" font-size="17">PLC 신호 읽기·쓰기</text><path d="M205 700V820" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/><text x="205" y="750" text-anchor="middle" fill="#cbd5e1" font-size="17">Mitsubishi FA</text><text x="205" y="775" text-anchor="middle" fill="#cbd5e1" font-size="17">설비 신호 연동</text><path d="M370 865H730" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/><text x="550" y="835" text-anchor="middle" fill="#cbd5e1" font-size="17">MQTT · 상태·이동·검사 결과</text><path d="M895 820V445H680" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/><text x="875" y="565" text-anchor="middle" fill="#cbd5e1" font-size="17">MQTT 수신</text><rect x="350" y="30" width="330" height="90" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="515" y="66" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">작업자 화면</text><text x="515" y="96" text-anchor="middle" fill="#cbd5e1" font-size="17">WinForms HMI</text><rect x="350" y="200" width="330" height="90" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="515" y="236" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">MES 서버</text><text x="515" y="266" text-anchor="middle" fill="#cbd5e1" font-size="17">ASP.NET Core · HTTP API</text><rect x="350" y="400" width="330" height="90" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="515" y="436" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">통신 프로그램</text><text x="515" y="466" text-anchor="middle" fill="#cbd5e1" font-size="17">Mes.Gateway</text><rect x="40" y="610" width="330" height="90" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="205" y="646" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">PLC 시뮬레이터</text><text x="205" y="676" text-anchor="middle" fill="#cbd5e1" font-size="17">GX Simulator2 · MX Component</text><rect x="40" y="820" width="330" height="90" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/><text x="205" y="856" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">가상 생산 설비</text><text x="205" y="886" text-anchor="middle" fill="#cbd5e1" font-size="17">MELSOFT Gemini</text><rect x="730" y="200" width="330" height="90" rx="12" fill="#1e293b"